name: Validate problem statistics

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  statistics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify generated statistics
        run: python3 scripts/count_problems.py --check

